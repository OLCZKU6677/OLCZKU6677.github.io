main: pl.olczku.commands.CORE_SHIELD

api-version: 1.18
author: WOOLCODE
commands:
  gm:
    description: Zmienia tryb gry.
    usage: /gm <tryb>
    permission: core.gm
  heal:
    description: Leczy gracza.
    usage: /heal
    permission: core.heal
  feed:
    description: Karmi gracza.
    usage: /feed
    permission: core.feed
  repair:
    description: Naprawia przedmioty.
