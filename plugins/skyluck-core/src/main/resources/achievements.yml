
#
# Typy eventów dostępne:
# - block-break: niszczenie bloków
# - block-place: stawianie bloków
# - entity-kill: zabijanie istot
# - player-death: śmierć gracza
# - join: wejście na serwer
# - location: osiągnięcie lokacji
# - item-craft: craftowanie przedmiotów
# - item-enchant: enchantowanie przedmiotów
# - player-move: poruszanie się gracza
# - custom: własne eventy

